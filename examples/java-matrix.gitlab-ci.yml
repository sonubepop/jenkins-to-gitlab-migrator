# Generated by jenkins2gitlab from a declarative Jenkinsfile.
# Automatic conversions: 9 | Items that need manual review: 0

stages:
  - build
  - test
  - integration

variables:
  TARGET_ENV:
    value: dev
    options:
      - dev
      - qa
      - prod
    description: Where to deploy
  RUN_SLOW_TESTS:
    value: 'false'
    description: Run slow integration tests

build:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  script:
    - mvn -B -DskipTests package
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 week

test-on-jdk:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  parallel:
    matrix:
      - JDK:
          - '17'
          - '21'
  script:
    - mvn -B test

integration:
  stage: integration
  image: maven:3.9-eclipse-temurin-17
  script:
    - cd integration
    - mvn -B verify
    - cd "$CI_PROJECT_DIR"
  after_script:
    - |
        if [ "$CI_JOB_STATUS" = "failed" ]; then
          cat target/failsafe-reports/*.txt || true
        fi
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^release\/.*$/ && $RUN_SLOW_TESTS == "true"
