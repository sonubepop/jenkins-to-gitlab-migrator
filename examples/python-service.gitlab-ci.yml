# Generated by jenkins2gitlab from a declarative Jenkinsfile.
# Automatic conversions: 16 | Items that need manual review: 5
#
# Manual review:
#   - pipeline: credential 'deploy-token' used as DEPLOY_TOKEN - create a masked/protected CI/CD variable named DEPLOY_TOKEN in Settings > CI/CD > Variables (or read it from Vault)
#   - pipeline.options: disableConcurrentBuilds - add 'resource_group' to deploy jobs, or enable 'auto-cancel redundant pipelines'
#   - pipeline.triggers: cron -> create a pipeline schedule '0 2 * * 1-5' (Build > Pipeline schedules)
#   - stage 'Build image': job runs docker commands - use a runner with Docker access, or image: docker:27 with services: [docker:27-dind]
#   - stage 'Deploy to staging': withCredentials(kubeconfig-staging) - create File-type CI/CD variable(s) KUBECONFIG (or fetch them from Vault with 'secrets:')

default:
  image: python:3.12-slim
  timeout: 30 minutes
  before_script:
    - pip install -r requirements.txt
stages:
  - quality
  - build-image
  - deploy-to-staging
  - deploy-to-production

variables:
  APP_NAME: inventory-api
  REGISTRY: registry.example.com/team

lint:
  stage: quality
  script:
    - ruff check .

unit-tests:
  stage: quality
  script:
    - pytest --junitxml=reports/junit.xml
  artifacts:
    when: always
    reports:
      junit: reports/junit.xml

build-image:
  stage: build-image
  tags:
    - docker
  script:
    - |
        docker build -t ${REGISTRY}/${APP_NAME}:${CI_PIPELINE_IID} .
        docker push ${REGISTRY}/${APP_NAME}:${CI_PIPELINE_IID}

deploy-to-staging:
  stage: deploy-to-staging
  script:
    - kubectl set image deployment/${APP_NAME} app=${REGISTRY}/${APP_NAME}:${CI_PIPELINE_IID}
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy-to-production:
  stage: deploy-to-production
  retry: 2
  script:
    - ./scripts/deploy.sh production
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*$/
      when: manual

post-failure:
  stage: .post
  script:
    - echo "Build ${CI_PIPELINE_IID} failed on ${CI_COMMIT_REF_NAME}"
  when: on_failure
