# Hand-finished GitLab CI pipeline for this project.
# Starting point: `python -m jenkins2gitlab Jenkinsfile` (see docs/self-migration.md).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  image: python:3.12-slim
  timeout: 20 minutes
  interruptible: true
  cache:
    key:
      files:
        - pyproject.toml
    paths:
      - .pip-cache/
  before_script:
    - pip install -q -e ".[dev]"

variables:
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.pip-cache

stages:
  - check
  - validate
  - build
  - deploy

lint:
  stage: check
  script:
    - ruff check .

unit-tests:
  stage: check
  script:
    - pytest --junitxml=reports/junit.xml --cov=jenkins2gitlab --cov-report=term --cov-report=xml:reports/coverage.xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: reports/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: reports/coverage.xml

validate-examples:
  stage: validate
  before_script:
    - apt-get update -qq && apt-get install -y -qq git > /dev/null
    - pip install -q -e ".[dev]"
  script:
    - ./scripts/validate-examples.sh
  artifacts:
    expire_in: 1 week
    paths:
      - examples/*.migration-report.md

build-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: /certs
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker run --rm "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" --version
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi
  resource_group: registry
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

pages:
  stage: deploy
  before_script: []
  script:
    - mkdir -p public/jenkins2gitlab public/examples
    - cp web/* public/
    - cp jenkins2gitlab/*.py public/jenkins2gitlab/
    - cp examples/*.Jenkinsfile public/examples/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
