[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jenkins2gitlab"
version = "0.1.0"
description = "Convert declarative Jenkinsfiles to .gitlab-ci.yml, with a migration report of what needs manual review"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aakash Girish" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "pyyaml", "ruff", "check-jsonschema"]

[project.scripts]
jenkins2gitlab = "jenkins2gitlab.cli:main"

[tool.setuptools]
packages = ["jenkins2gitlab"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP007"]

[tool.pytest.ini_options]
testpaths = ["tests"]
